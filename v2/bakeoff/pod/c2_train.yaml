# The unshadowed style LoRA of bake-off method C (job C2): v1 style v2 config (pipeline/gpu_train/v2/v2.yaml) with
# new targets (unshadowed, checked: v2/bakeoff/dataset.py), 2,000 steps, checkpoints every 200 (the pilot stops at 200).
job: extension
config:
  name: luxembourg-ink-unshadowed
  process:
  - type: sd_trainer
    training_folder: /workspace/output
    device: cuda:0
    network:
      type: lora
      linear: 16
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 200
      max_step_saves_to_keep: 10
    logging:
      log_every: 10
      verbose: false
      use_wandb: false
    datasets:
    - folder_path: /workspace/data
      control_path:
      - /workspace/control
      - /workspace/layout
      caption_ext: txt
      caption_dropout_rate: 0.05
      resolution:
      - 1024
    train:
      batch_size: 1
      cache_text_embeddings: false
      steps: 2000
      gradient_accumulation: 1
      timestep_type: weighted
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 0.0001
      dtype: bf16
    model:
      name_or_path: Qwen/Qwen-Image-Edit-2511
      arch: qwen_image_edit_plus
      quantize: false
      low_vram: false
      model_kwargs:
        match_target_res: false
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      neg: ''
      seed: 1867
      walk_seed: false
      guidance_scale: 3
      sample_steps: 25
      samples:
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/place_in.png
        ctrl_img_2: /workspace/tests/place_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/station_in.png
        ctrl_img_2: /workspace/tests/station_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/grund_in.png
        ctrl_img_2: /workspace/tests/grund_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/red_in.png
        ctrl_img_2: /workspace/tests/red_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/glacis_in.png
        ctrl_img_2: /workspace/tests/glacis_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/kirchberg_in.png
        ctrl_img_2: /workspace/tests/kirchberg_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present)."
        ctrl_img_1: /workspace/tests/hotel_in.png
        ctrl_img_2: /workspace/tests/hotel_lay.png
meta:
  name: luxembourg-ink-unshadowed
  version: '1.0'
