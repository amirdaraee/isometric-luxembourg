# The unshadowed style LoRA of bake-off method C (job C2): v1 style v2 config (pipeline/gpu_train/v2/v2.yaml) with
# new targets (unshadowed, checked: v2/bakeoff/dataset.py), 2,000 steps, checkpoints every 200 (the pilot stops at 200).
# pod/run.sh sets the steps (200 for the pilot C2p, 2,000 for C2, which resumes from the pilot's checkpoint) and how
# often the three held-out test windows are sampled (every 200 in the pilot, every 600 after it): each round of
# samples costs about 1.5 minutes of the job's time cap.
job: extension
config:
  name: luxembourg-ink-unshadowed
  process:
  - type: sd_trainer
    training_folder: /workspace/output
    device: cuda:0
    network:
      type: lora
      linear: 16
      linear_alpha: 16
    save:
      dtype: float16
      save_every: 200
      max_step_saves_to_keep: 10
    logging:
      log_every: 10
      verbose: false
      use_wandb: false
    datasets:
    - folder_path: /workspace/data
      control_path:
      - /workspace/control
      - /workspace/layout
      caption_ext: txt
      caption_dropout_rate: 0.05
      resolution:
      - 1024
    train:
      batch_size: 1
      cache_text_embeddings: false
      steps: 2000
      gradient_accumulation: 1
      timestep_type: weighted
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      lr: 0.0001
      dtype: bf16
    model:
      name_or_path: Qwen/Qwen-Image-Edit-2511
      arch: qwen_image_edit_plus
      quantize: false
      low_vram: false
      model_kwargs:
        match_target_res: false
    sample:
      sampler: flowmatch
      sample_every: 600
      skip_first_sample: false
      width: 1024
      height: 1024
      neg: ''
      seed: 1867
      walk_seed: false
      guidance_scale: 3
      sample_steps: 25
      samples:
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink unshadowed> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present). Evenly lit with flat light: no shadows, no shading from one side, nothing that moves."
        ctrl_img_1: /workspace/tests/t0_in.png
        ctrl_img_2: /workspace/tests/t0_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink unshadowed> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present). Evenly lit with flat light: no shadows, no shading from one side, nothing that moves."
        ctrl_img_1: /workspace/tests/t1_in.png
        ctrl_img_2: /workspace/tests/t1_lay.png
      - prompt: "Fill in the outlined section with the missing pixels corresponding to the <isometric luxembourg ink unshadowed> style, removing the border and exactly following the shape/style/structure of the surrounding image (if present). Evenly lit with flat light: no shadows, no shading from one side, nothing that moves."
        ctrl_img_1: /workspace/tests/t2_in.png
        ctrl_img_2: /workspace/tests/t2_lay.png
meta:
  name: luxembourg-ink-unshadowed
  version: '1.0'
