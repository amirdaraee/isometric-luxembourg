name: CI
on:
  pull_request:
  push:
    branches: [main, v2]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build   # no tiles in CI: this checks that the code builds, the site is deployed from a local build
  v2:
    # v2 unit tests on small fixtures (no data downloads); the full checks run on the test area with python -m v2.build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r v2/requirements.txt
      - run: python -m pytest -q v2
