# Minimal Cloudflare Worker for R2 caching
# Just adds Cache-Control headers to R2 responses

name = "isometric-luxembourg-tiles"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "isometric-luxembourg"
preview_bucket_name = "isometric-luxembourg"
