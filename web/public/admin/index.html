<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http: https:; base-uri 'none'; form-action 'none'">
<title>Notes from the map</title>
<style>
  :root { --ink: #f4f1ea; --mute: #aeb4c2; --bg: #101828; --red: #ef3340; --line: rgba(255,255,255,.14); --card: rgba(255,255,255,.05); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 18px; color: var(--mute); }
  form, .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 16px; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); }
  input, select { min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.07); color: var(--ink); font: inherit; }
  input[type=url] { width: 260px; } input[type=password] { width: 260px; }
  button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.08); color: var(--ink); font: 600 13px/1 system-ui, sans-serif; cursor: pointer; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #00a1de; outline-offset: 2px; }
  #status { min-height: 20px; color: var(--mute); }
  #status.bad { color: #ff8a93; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  li.done { opacity: .6; }
  .text { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--mute); font-size: 12px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .actions a { color: #7bdff2; margin-right: auto; }
  .empty { color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Notes from the map</h1>
  <p class="sub">Private notes visitors left on the map. Local page only, never published. The token stays in this tab (sessionStorage).</p>

  <form id="login">
    <label>API URL <input id="api" type="url" required placeholder="https://api.isometric.lu" autocomplete="off"></label>
    <label>Admin token <input id="token" type="password" required autocomplete="off"></label>
    <button class="primary" type="submit">Load notes</button>
    <button id="forget" type="button">Forget token</button>
  </form>

  <div class="bar">
    <label>Show
      <select id="filter"><option value="new">New</option><option value="done">Done</option><option value="all">All</option></select>
    </label>
    <button id="reload" type="button">Refresh</button>
  </div>

  <p id="status" role="status"></p>
  <ol id="list" aria-label="Notes, newest first"></ol>
  <p><button id="more" type="button" hidden>Load older notes</button></p>
</main>
<script>
"use strict";
// Every value from the API is put on the page with textContent or as an attribute value, never as HTML.
const $ = (id) => document.getElementById(id);
const store = window.sessionStorage;
const api = $("api"), token = $("token"), list = $("list"), status = $("status"), more = $("more"), filter = $("filter");
api.value = store.getItem("fb-api") || (location.hostname === "localhost" ? "http://localhost:8787" : "");
token.value = store.getItem("fb-token") || "";
let next = null;

function say(msg, bad) { status.textContent = msg; status.className = bad ? "bad" : ""; }
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "text") e.textContent = v;
    else if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}
function base() {
  const u = new URL(api.value.trim());
  if (u.protocol !== "https:" && u.hostname !== "localhost") throw new Error("Use https (or localhost).");
  return u.origin;
}
async function call(path, opts = {}) {
  const r = await fetch(base() + path, {
    ...opts,
    credentials: "omit",
    headers: { Authorization: "Bearer " + token.value.trim(), ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 401 ? "Wrong token." : r.status === 429 ? "Too many failed tries: wait ten minutes." : "Request failed (" + r.status + ").");
  return body;
}

function mapLink(c) {
  const x = Math.round((c.box.x0 + c.box.x1) / 2), y = Math.round((c.box.y0 + c.box.y1) / 2);
  // zoom so the box fills about half of a 1200 px wide screen
  const w = Math.max(c.box.x1 - c.box.x0, c.box.y1 - c.box.y0, 1);
  const z = Math.min(Math.max(600 / w, 0.05), 1.2);
  return "/#" + x + "," + y + "," + z.toFixed(3);
}

function row(c) {
  const when = new Date(c.createdAt);
  const li = el("li", { class: c.status === "done" ? "done" : "" },
    el("p", { class: "text", text: c.text }),
    el("div", { class: "meta" },
      el("span", {}, el("b", { text: "From: " }), document.createTextNode(c.contact || "anonymous")),
      el("span", { text: when.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }), title: when.toISOString() }),
      el("span", { text: "Country: " + (c.country || "unknown") }),
      el("span", { text: "Sender: " + (c.sender || "n/a"), title: "Short tag of the hashed IP, to spot repeat senders" }),
      el("span", { text: "Box: " + [c.box.x0, c.box.y0, c.box.x1, c.box.y1].map(Math.round).join(", ") }),
      c.features ? el("span", { text: "Features: " + c.features, title: c.userAgent || "" }) : null,
      el("span", { text: "#" + c.id }),
    ),
  );
  const toggle = el("button", { type: "button", text: c.status === "done" ? "Mark as new" : "Mark done",
    onclick: async () => {
      try { await call("/api/comments/" + c.id, { method: "PATCH", body: JSON.stringify({ status: c.status === "done" ? "new" : "done" }) }); load(true); }
      catch (e) { say(e.message, true); }
    } });
  const del = el("button", { type: "button", text: "Delete",
    onclick: async () => {
      if (!confirm("Delete note #" + c.id + " for good?")) return;
      try { await call("/api/comments/" + c.id, { method: "DELETE" }); li.remove(); say("Deleted #" + c.id + "."); }
      catch (e) { say(e.message, true); }
    } });
  li.append(el("div", { class: "actions" }, el("a", { href: mapLink(c), target: "_blank", rel: "noopener noreferrer", text: "Show on map" }), toggle, del));
  return li;
}

async function load(fresh) {
  if (!token.value.trim() || !api.value.trim()) { say("Enter the API URL and the admin token."); return; }
  if (fresh) { list.replaceChildren(); next = null; }
  say("Loading…");
  try {
    const q = new URLSearchParams({ status: filter.value, limit: "50" });
    if (next) q.set("before", String(next));
    const { comments, next: n } = await call("/api/comments?" + q);
    store.setItem("fb-api", api.value.trim());
    store.setItem("fb-token", token.value.trim());
    for (const c of comments) list.append(row(c));
    next = n;
    more.hidden = !n;
    say(list.children.length ? list.children.length + " note" + (list.children.length === 1 ? "" : "s") + " shown." : "No notes here.");
  } catch (e) { say(e.message || "Request failed.", true); }
}

$("login").addEventListener("submit", (e) => { e.preventDefault(); load(true); });
$("reload").addEventListener("click", () => load(true));
filter.addEventListener("change", () => load(true));
more.addEventListener("click", () => load(false));
$("forget").addEventListener("click", () => { store.removeItem("fb-token"); token.value = ""; list.replaceChildren(); more.hidden = true; say("Token forgotten."); });
if (token.value) load(true);
</script>
</body>
</html>
